<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Catálogo FRAN7 | T-shirts, conjuntos e acessórios</title>
    <meta name="description" content="Explora o catálogo FRAN7: t-shirts, conjuntos, bonés e outros artigos. Consulta modelos, cores e preços e faz a tua encomenda em Angola.">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://fran7official.github.io/Fran7/catalogo.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_AO">
    <meta property="og:site_name" content="FRAN7">
    <meta property="og:title" content="Catálogo FRAN7 | T-shirts, conjuntos e acessórios">
    <meta property="og:description" content="Consulta os modelos, cores e preços da coleção FRAN7 e encomenda em Angola.">
    <meta property="og:url" content="https://fran7official.github.io/Fran7/catalogo.html">
    <meta property="og:image" content="https://fran7official.github.io/Fran7/assets/images/1.jpg.jpeg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="assets/images/logoo.png.png">
    <link rel="stylesheet" href="assets/css/assistente.css">
    <link rel="stylesheet" href="assets/css/carrinho-compartilhado.css">
    <link rel="stylesheet" href="assets/css/detalhe-produto.css">
    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff;
            color: #111;
        }

        a {
            color: inherit;
        }

        .cabecalho-catalogo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 24px 0;
            border-bottom: 1px solid #ddd;
        }

        .marca img {
            display: block;
            width: 130px;
            max-height: 50px;
            object-fit: contain;
            text-decoration: none;
        }

        .voltar-loja {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            padding: 0 17px;
            border: 1px solid currentColor;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-decoration: none;
            transition: background-color .2s ease, color .2s ease;
        }

        .voltar-loja:hover {
            background: #111;
            color: #fff;
        }

        main {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
            padding: 62px 0 80px;
        }

        .intro {
            max-width: 700px;
            margin: 0 auto 42px;
            text-align: center;
        }

        .intro-etiqueta {
            margin: 0 0 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .2em;
            opacity: .62;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(30px, 5vw, 52px);
            letter-spacing: .06em;
        }

        .intro p:last-child {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            opacity: .7;
        }

        .modelos-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .modelo {
            overflow: hidden;
            border: 1px solid rgba(128, 128, 128, .28);
            border-radius: 18px;
            background: rgba(128, 128, 128, .04);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .modelo:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .12);
        }

        .modelo-imagem {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #f2f2f2;
        }

        .modelo-imagem img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .4s ease;
        }

        .modelo-imagem .botao-favorito,
        .produto-imagem .botao-favorito {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1;
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            border: 1px solid rgba(128, 128, 128, .45);
            border-radius: 50%;
            background: rgba(255, 255, 255, .88);
            color: #333;
            font-size: 24px;
            cursor: pointer;
        }

        .botao-favorito.ativo .coracao { color: #e60035; }

        .modelo:hover .modelo-imagem img {
            transform: scale(1.035);
        }

        .modelo-info {
            padding: 18px;
        }

        .modelo-etiqueta {
            margin: 0 0 7px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .16em;
            opacity: .58;
        }

        .modelo h2 {
            margin: 0 0 9px;
            font-size: 17px;
        }

        .modelo-preco {
            min-height: 22px;
            margin: 0 0 16px;
            font-size: 15px;
            font-weight: 700;
        }

        .modelo-pedir {
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            padding: 0 14px;
            border: 1px solid rgba(128, 128, 128, .4);
            border-radius: 12px;
            background: rgba(128, 128, 128, .1);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-align: center;
            text-decoration: none;
            transition: background-color .2s ease, border-color .2s ease;
        }

        .modelo-pedir:hover {
            border-color: #25d366;
            background: #25d366;
            color: #fff;
        }

        .rodape-catalogo {
            padding: 24px 20px;
            border-top: 1px solid rgba(128, 128, 128, .28);
            font-size: 12px;
            text-align: center;
            opacity: .68;
        }

        @media (max-width: 760px) {
            .modelos-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            main {
                padding-top: 42px;
            }

            .modelo-info {
                padding: 14px;
            }

            .modelo h2 {
                font-size: 15px;
            }
        }

        @media (max-width: 420px) {
            .cabecalho-catalogo,
            main {
                width: calc(100% - 28px);
            }

            .cabecalho-catalogo {
                gap: 10px;
            }

            .marca img {
                width: 110px;
            }

            .voltar-loja {
                padding: 0 12px;
                font-size: 10px;
            }

            .modelos-grid {
                gap: 10px;
            }

            .modelo-info {
                padding: 11px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root,
            body {
                background: #090909;
                color: #f5f5f5;
            }

            .marca img {
                filter: brightness(0) invert(1);
            }

            .cabecalho-catalogo {
                border-color: #292929;
            }

            .voltar-loja:hover {
                background: #f5f5f5;
                color: #111;
            }

            .modelo {
                border-color: #292929;
                background: #111;
            }

            .modelo-imagem {
                background: #1b1b1b;
            }

            .rodape-catalogo {
                border-color: #292929;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
        </style>
        <link rel="stylesheet" href="assets/css/tema-automatico.css">
    </head>
    <body class="fran7-subpage">
    <header class="cabecalho-catalogo">
        <a class="marca" href="inicio.html" aria-label="FRAN7, voltar ao início">
            <img src="assets/images/logo.png.png" alt="FRAN7">
        </a>
        <a class="voltar-loja" href="inicio.html#produtos">VOLTAR À LOJA</a>
    </header>

    <main>
        <section class="intro" aria-labelledby="tituloCatalogo">
            <p class="intro-etiqueta">FRAN7 COLLECTION</p>
            <h1 id="tituloCatalogo">MODELOS</h1>
            <p>Explora os modelos disponíveis e fala connosco pelo WhatsApp para pedir o teu.</p>
        </section>

        <section
            class="modelos-grid"
            id="modelosGrid"
            aria-label="Modelos disponíveis"
        ></section>
    </main>

    <footer class="rodape-catalogo">
        © 2026 FRAN7 — Todos os direitos reservados.
    </footer>

    <script>
        const modelos = [
            { nome: "Modelo FRAN7 01", imagem: "assets/images/1.png", preco: "11.000 Kz", imagensExtra: ["assets/images/TRIBE.CASTANHA.jpeg", "assets/images/TRIBLE.BEIGE.jpeg", "assets/images/TIBLE.CINZA.jpeg"], cores: ["Preto", "Castanho", "Bege", "Cinza"], reservar: true },
            { nome: "Modelo FRAN7 02", imagem: "assets/images/2.png", preco: "7.000 Kz", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 03", imagem: "assets/images/3.png", preco: "7.000 Kz", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 04", imagem: "assets/images/4.png", preco: "8.500 Kz", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 05", imagem: "assets/images/mulheres,%20conjunto.jpg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Meias FRAN7", imagem: "assets/images/meias.jpg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 07", imagem: "assets/images/a1.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 08", imagem: "assets/images/a2.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 09", imagem: "assets/images/a3.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 10", imagem: "assets/images/WhatsApp%20Image%202026-10-04%20at%202.24.22%20PM.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 11", imagem: "assets/images/WhatsApp%20Image%202026-10-04%20at%202.24.23%20PM.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Modelo FRAN7 12", imagem: "assets/images/WhatsApp%20Image%202026-10-04%20at%202.24.24%20PM.jpeg", preco: "Consultar preço", imagensExtra: [], cores: [] },
            { nome: "Boné FRAN7 Modelo 2", imagem: "assets/images/CASTANHO.MODELO2.jpeg", preco: "Consultar preço", imagensExtra: ["assets/images/CINZA.MODELO2.jpeg"], cores: ["Castanho", "Cinza"] }
        ];

        const modelosGrid =
            document.getElementById("modelosGrid");

        modelosGrid.innerHTML = modelos.map(function(modelo) {
            return `
                <article class="modelo" data-product-name="${modelo.nome}" data-product-price="${modelo.preco}" data-product-reserve="${modelo.reservar || false}" data-gallery-images="${(modelo.imagensExtra || []).join("|")}" data-gallery-colors="${(modelo.cores || []).join("|")}">
                    <div class="modelo-imagem">
                        <img src="${modelo.imagem}" alt="${modelo.nome}" loading="lazy">
                        <button
                            class="botao-favorito"
                            type="button"
                            data-favorite-name="${modelo.nome}"
                            data-favorite-image="${modelo.imagem}"
                            data-favorite-price="${Number(modelo.preco.replace(/[^0-9]/g, "")) || 0}"
                            data-favorite-reserve="${modelo.reservar || false}"
                            data-favorite-images="${(modelo.imagensExtra || []).join("|")}"
                            data-favorite-colors="${(modelo.cores || []).join("|")}"
                            aria-label="Adicionar aos favoritos"
                            aria-pressed="false"
                        ><span class="coracao" aria-hidden="true">♡</span></button>
                    </div>
                    <div class="modelo-info">
                        <p class="modelo-etiqueta">${modelo.etiqueta || "FRAN7 COLLECTION"}</p>
                        <h2>${modelo.nome}</h2>
                        <p class="modelo-preco">${modelo.preco}</p>
                        <button
                            class="fran7-cart-add"
                            type="button"
                            data-cart-name="${modelo.nome}"
                            data-cart-image="${modelo.imagem}"
                            data-cart-price="${Number(modelo.preco.replace(/[^0-9]/g, "")) || 0}"
                            aria-label="${modelo.reservar ? "Reservar" : "Adicionar"} ${modelo.nome} ${modelo.reservar ? "" : "ao carrinho"}"
                        >${modelo.reservar ? "RESERVAR" : "ADICIONAR AO CARRINHO"}</button>
                    </div>
                </article>
            `;
        }).join("");
    </script>
    <script src="assets/js/favoritos.js"></script>
    <script src="assets/js/carrinho-compartilhado.js"></script>
    <script src="assets/js/detalhe-produto.js"></script>
    <script src="assets/js/assistente-widget.js"></script>
    <script src="assets/js/assistente.js"></script>
</body>
</html>
