<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Os meus favoritos | FRAN7</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="assets/images/logoo.png.png">
    <link rel="stylesheet" href="assets/css/assistente.css">
    <link rel="stylesheet" href="assets/css/carrinho-compartilhado.css">
    <link rel="stylesheet" href="assets/css/detalhe-produto.css">
    <style>
        :root {
            color-scheme: light dark;
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: #f5f5f5;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #080808;
        }

        .cabecalho {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 14px max(5%, calc((100% - 1120px) / 2));
            border-bottom: 1px solid #292929;
            background: rgba(8, 8, 8, .96);
        }

        .marca img {
            display: block;
            width: 140px;
            max-height: 52px;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .voltar-loja {
            margin-left: auto;
            color: #ddd;
            font-size: 11px;
            letter-spacing: .08em;
            text-decoration: none;
        }

        main {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 70px 0 100px;
        }

        .intro {
            margin-bottom: 36px;
        }

        .intro-label {
            color: #929292;
            font-size: 10px;
            letter-spacing: .3em;
        }

        h1 {
            margin: 12px 0;
            font-size: clamp(36px, 6vw, 58px);
            letter-spacing: -.04em;
        }

        .intro p:last-child {
            color: #999;
            font-size: 14px;
        }

        .favoritos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .favorito-card {
            overflow: hidden;
            border: 1px solid #292929;
            border-radius: 20px;
            background: #101010;
        }

        .favorito-card img {
            display: block;
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #151515;
        }

        .favorito-card-info {
            padding: 18px;
        }

        .favorito-card-info h2 {
            margin: 0 0 9px;
            font-size: 16px;
        }

        .favorito-card-price {
            margin: 0 0 14px;
            color: #aaa;
            font-size: 13px;
        }

        .favorito-card-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favorito-card-actions .fran7-cart-add {
            flex: 1;
            margin: 0;
        }

        .favorito-card-actions .botao-favorito {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            place-items: center;
            border: 1px solid #484848;
            border-radius: 50%;
            background: transparent;
            color: #f06;
            font-size: 23px;
            cursor: pointer;
        }

        .favoritos-vazio {
            grid-column: 1 / -1;
            padding: 55px 20px;
            border: 1px dashed #444;
            border-radius: 18px;
            color: #aaa;
            text-align: center;
        }

        .favoritos-vazio a {
            display: inline-block;
            margin-top: 12px;
            color: #fff;
        }

        @media (max-width: 480px) {
            .cabecalho { padding: 12px 16px; }
            .marca img { width: 110px; }
            main { padding-top: 48px; }
            .favoritos-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .favorito-card img { height: 180px; }
            .favorito-card-info { padding: 12px; }
            .favorito-card-info h2 { font-size: 14px; }
        }
    </style>
    <link rel="stylesheet" href="assets/css/tema-automatico.css">
</head>
<body class="fran7-subpage">
    <header class="cabecalho">
        <a class="marca" href="inicio.html" aria-label="FRAN7, voltar ao início">
            <img src="assets/images/logo.png.png" alt="FRAN7">
        </a>
        <a class="voltar-loja" href="inicio.html#produtos">CONTINUAR A EXPLORAR</a>
    </header>

    <main>
        <div class="intro">
            <p class="intro-label">FRAN7 COLLECTION</p>
            <h1>Os meus favoritos</h1>
            <p>As peças que guardaste para ver mais tarde.</p>
        </div>
        <section class="favoritos-grid" id="favoritosGrid" aria-live="polite"></section>
    </main>

    <script src="assets/js/favoritos.js"></script>
    <script src="assets/js/carrinho-compartilhado.js"></script>
    <script src="assets/js/detalhe-produto.js"></script>
    <script src="assets/js/assistente-widget.js"></script>
    <script src="assets/js/assistente.js"></script>
    <script>
        (function() {
            "use strict";

            const grid = document.getElementById("favoritosGrid");

            function renderizarFavoritos() {
                let favoritos;
                try {
                    favoritos = JSON.parse(
                        localStorage.getItem("fran7_favorites_v1") || "[]"
                    );
                    if (!Array.isArray(favoritos)) {
                        throw new TypeError("Os favoritos guardados não são uma lista.");
                    }
                } catch (error) {
                    console.error("Não foi possível mostrar os favoritos guardados:", error);
                    grid.replaceChildren();
                    const errorMessage = document.createElement("p");
                    errorMessage.className = "favoritos-vazio";
                    errorMessage.textContent = "Não foi possível carregar os favoritos. Atualiza a página para tentar novamente.";
                    grid.appendChild(errorMessage);
                    return;
                }

                grid.replaceChildren();
                if (favoritos.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "favoritos-vazio";
                    empty.textContent = "Ainda não guardaste produtos nos favoritos.";
                    const link = document.createElement("a");
                    link.href = "inicio.html#produtos";
                    link.textContent = "Explorar produtos";
                    empty.appendChild(document.createElement("br"));
                    empty.appendChild(link);
                    grid.appendChild(empty);
                    return;
                }

                favoritos.forEach(function(item) {
                    const card = document.createElement("article");
                    card.className = "favorito-card";
                    card.dataset.productReserve = item.reservar === true ? "true" : "false";
                    card.dataset.galleryImages = (item.imagensExtra || []).join("|");
                    card.dataset.galleryColors = (item.cores || []).join("|");

                    const image = document.createElement("img");
                    image.src = item.imagem;
                    image.alt = item.nome;
                    image.loading = "lazy";

                    const info = document.createElement("div");
                    info.className = "favorito-card-info";

                    const name = document.createElement("h2");
                    name.textContent = item.nome;

                    const price = document.createElement("p");
                    price.className = "favorito-card-price";
                    price.textContent = Number(item.preco)
                        ? Number(item.preco).toLocaleString("pt-AO") + " Kz"
                        : "Consultar preço";

                    const actions = document.createElement("div");
                    actions.className = "favorito-card-actions";

                    const add = document.createElement("button");
                    add.type = "button";
                    add.className = "fran7-cart-add";
                    add.textContent = item.reservar === true ? "RESERVAR" : "ADICIONAR À SACOLA";
                    add.dataset.cartName = item.nome;
                    add.dataset.cartImage = item.imagem;
                    add.dataset.cartPrice = String(Number(item.preco) || 0);

                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "botao-favorito ativo";
                    remove.dataset.favoriteName = item.nome;
                    remove.dataset.favoriteImage = item.imagem;
                    remove.dataset.favoritePrice = String(Number(item.preco) || 0);
                    remove.setAttribute("aria-label", "Remover dos favoritos");
                    remove.setAttribute("aria-pressed", "true");
                    remove.innerHTML = '<span class="coracao" aria-hidden="true">♥</span>';

                    actions.append(add, remove);
                    info.append(name, price, actions);
                    card.append(image, info);
                    grid.appendChild(card);
                });
            }

            window.addEventListener("fran7-favorites-updated", renderizarFavoritos);
            window.addEventListener("storage", function(event) {
                if (event.key === "fran7_favorites_v1") {
                    renderizarFavoritos();
                }
            });
            renderizarFavoritos();
        })();
    </script>
</body>
</html>
